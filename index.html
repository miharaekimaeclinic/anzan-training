<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>暗算トレーニング 検定対応版</title><style>
:root{font-family:system-ui,-apple-system,'Yu Gothic',Meiryo,sans-serif;color:#152238;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:0 auto;padding:16px 14px 65px}h1{font-size:clamp(22px,5vw,30px);margin:8px 0}p{line-height:1.6}small,.muted{color:#65748b}.panel{background:white;padding:18px;border-radius:16px;margin:16px 0;box-shadow:0 4px 20px #182b4710}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{min-width:0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}select,input[type=number]{width:100%;border:1px solid #cad5e3;border-radius:9px;padding:11px;background:white;font-size:16px;color:#152238}button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:#245dc1;color:white;font-weight:700;cursor:pointer;touch-action:manipulation}button.secondary{background:#e8eef8;color:#254578}button:disabled{opacity:.4;cursor:default}.full{width:100%;margin-top:12px}.hidden{display:none!important}.info{background:#f0f5ff;border-radius:10px;padding:12px;margin-top:12px;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tab{background:#e8eef8;color:#244576}.tab.active{background:#245dc1;color:white}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{min-height:155px;display:flex;align-items:center;justify-content:center;font-size:clamp(35px,8vw,65px);font-weight:750;letter-spacing:1px;font-variant-numeric:tabular-nums}.mitori{display:flex;flex-direction:column;align-items:flex-end;width:max-content;margin:auto;font-size:clamp(23px,5.7vw,42px);line-height:1.35;font-variant-numeric:tabular-nums}.mitori div{width:100%;text-align:right}.mitori div:last-child{border-bottom:3px solid #152238}.answer{height:70px;border:2px solid #c5d5ed;background:#f8fbff;border-radius:12px;display:flex;align-items:center;justify-content:flex-end;gap:3px;padding:10px;overflow:hidden;font-size:clamp(27px,7vw,42px);font-variant-numeric:tabular-nums}.answer.empty{color:#9aa9bf}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.keypad button{background:#e9eff9;color:#193457;font-size:24px;padding:15px 6px;min-height:54px}.keypad .action{background:#d5e1f1;font-size:17px}.keypad .confirm{background:#245dc1;color:white;font-size:19px}.result{font-size:23px;font-weight:700;text-align:center}.review{padding:9px 0;border-bottom:1px solid #e1e6ef;font-variant-numeric:tabular-nums}.controls{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.controls button{flex:1}.progress{height:8px;background:#e8eef8;border-radius:8px;overflow:hidden;margin-top:9px}.progress>div{height:100%;width:0;background:#245dc1;transition:width .2s}.mode-note{font-size:12px}.toggleline{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:12px}.toggleline input{height:18px;width:18px}.clock{font-variant-numeric:tabular-nums}.flashCenter{font-size:clamp(55px,13vw,95px)}.good{color:#13734b}.bad{color:#c12d3c}footer{font-size:12px;color:#617088;line-height:1.7;margin-top:25px}@media(max-width:470px){.panel{padding:14px}.grid{gap:10px}.top{font-size:14px}.tabs button{padding:11px 6px}.keypad button{padding:13px 4px}main{padding:10px 10px 50px}}@media(min-width:650px){.tabs{grid-template-columns:repeat(4,1fr)}.keypad{max-width:430px;margin:14px auto}.answer{max-width:430px;margin:auto}}
</style></head><body><main><h1>🧮 暗算トレーニング</h1><p class="muted">日本珠算連盟の暗算検定に準じた桁数で練習。スマホ・PC対応、通信不要。</p>
<section id="settings" class="panel"><h2>練習設定</h2><div class="tabs" id="tabs"><button class="tab active" data-mode="mitori">見取暗算</button><button class="tab" data-mode="flash">フラッシュ暗算</button><button class="tab" data-mode="multiply">かけ暗算</button><button class="tab" data-mode="divide">わり暗算</button></div><div class="grid" style="margin-top:16px"><div class="field"><label for="grade">検定級</label><select id="grade"><option value="10">10級</option><option value="9">9級</option><option value="8">8級</option><option value="7">7級</option><option value="6">6級</option><option value="5">5級</option><option value="4">4級</option><option value="p3">準3級</option><option value="3" selected>3級</option><option value="p2">準2級</option><option value="2">2級</option><option value="p1">準1級</option><option value="1">1級</option></select></div><div class="field"><label for="count">問題数（1〜100）</label><input type="number" id="count" min="1" max="100" value="10"></div><div class="field"><label for="direction">解答の入力順</label><select id="direction"><option value="high">上の桁（左）から</option><option value="low">下の桁（右）から</option></select></div><div class="field" id="speedField"><label for="speed">フラッシュ表示間隔（秒）</label><select id="speed"><option>0.2</option><option>0.3</option><option selected>0.5</option><option>0.7</option><option>1</option><option>1.5</option><option>2</option><option>3</option></select></div></div><label class="toggleline"><input type="checkbox" id="negative"> 見取・フラッシュで引き算を混ぜる（練習用）</label><label class="toggleline"><input type="checkbox" id="limit"> 12分の制限時間を付ける</label><div class="info" id="gradeInfo"></div><button id="start" class="full">練習を開始</button></section>
<section id="game" class="panel hidden"><div class="top"><strong id="counter">第1問 / 10問</strong><span class="clock" id="timer">00:00</span><button id="quit" class="secondary" style="padding:7px 10px">終了</button></div><div class="progress"><div id="bar"></div></div><p id="qmeta" class="muted mode-note" style="text-align:center"></p><div id="question" class="question" aria-live="polite"></div><div id="prompt" class="muted" style="text-align:center;margin-bottom:8px">答えを入力してください</div><div id="answer" class="answer empty" aria-live="polite">ここに答えを入力</div><div class="keypad" id="keypad"><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button class="action" data-key="back">⌫ 消す</button><button data-key="0">0</button><button class="confirm" data-key="enter">決定 ↵</button><button class="action" data-key="minus" style="grid-column:1 / -1">± マイナス切替</button></div><p class="mode-note muted" id="directionNote" style="text-align:center"></p></section>
<section id="results" class="panel hidden"><h2>練習結果</h2><p id="score" class="result"></p><p id="elapsed" style="text-align:center"></p><div id="review"></div><div class="controls" style="margin-top:16px"><button id="retry">同じ設定でもう一度</button><button id="backSettings" class="secondary">設定に戻る</button></div></section>
<footer>桁数は日本珠算連盟「暗算検定試験」の級別表を参考にしています。公式試験そのものではありません。フラッシュ暗算は同じ級の見取暗算の桁数・口数を流用した独自練習です。かけ算・わり算の桁数組み合わせは、指定された合計桁数の範囲内で自動生成します。</footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const cfg={mode:'mitori'}, grades={"10":[[1,3,3],[1,4,4],[1,5,5]],"9":[[1,3,3],[1,4,4],[1,5,5]],"8":[[1,3,3],[1,4,4],[1,5,5]],"7":[[1,3,3],[1,4,4],[1,5,5]],"6":[[1,5,6]],"5":[[1,5,8]],"4":[[2,5,10]],"p3":[[2,5,10],[3,5,15]],"3":[[3,5,15]],"p2":[[3,5,15],[3,7,21]],"2":[[3,7,21]],"p1":[[3,7,21],[3,10,30]],"1":[[3,10,30]]};const totals={"6":[3],"5":[3],"4":[3],"p3":[3,4],"3":[4],"p2":[4],"2":[4],"p1":[4,5],"1":[5]};const pick=a=>a[Math.floor(Math.random()*a.length)];const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;const digits=d=>rand(d===1?1:10**(d-1),10**d-1);const label=g=>g.startsWith('p')?'準'+g.slice(1)+'級':g+'級';let questions=[],index=0,typed='',answers=[],started=0,ticker=null,flashTimers=[];const btns=[...document.querySelectorAll('.tab')];function show(id){['settings','game','results'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function updateSettings(){const g=$('grade').value,m=cfg.mode;const isYoung=['7','8','9','10'].includes(g);$('speedField').classList.toggle('hidden',m!=='flash');$('negative').parentElement.classList.toggle('hidden',!['mitori','flash'].includes(m));$('gradeInfo').innerHTML=(isYoung&&['multiply','divide'].includes(m)?'<strong>この級にはかけ・わり暗算の出題がありません。</strong> 6級以上を選んでください。<br>':'')+'<strong>'+label(g)+'</strong>：'+(m==='multiply'?'実法合わせて '+(totals[g]||[]).join('・')+'桁':m==='divide'?'法商合わせて '+(totals[g]||[]).join('・')+'桁':grades[g].map(a=>a[0]+'桁・'+a[1]+'口'+(a[2]!==a[0]*a[1]?'・計'+a[2]+'字':'')).join(' ／ '))+(m==='flash'?'（フラッシュ練習への応用）':'')+'。<br>問題数は自由設定。解答方向はテンキーにも対応します。';$('start').disabled=isYoung&&['multiply','divide'].includes(m)}btns.forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;btns.forEach(x=>x.classList.toggle('active',x===b));updateSettings()});$('grade').onchange=updateSettings;
function makeMitori(g){const specs=grades[g];const spec=specs.length===1?specs[0]:specs[index%specs.length];let [maxD,rows,chars]=spec;let ds=Array(rows).fill(maxD);while(ds.reduce((a,b)=>a+b,0)>chars){const possible=ds.map((d,i)=>d>1?i:-1).filter(i=>i>=0);ds[pick(possible)]--}ds.sort(()=>Math.random()-.5);let vals=ds.map(d=>digits(d));if($('negative').checked&&maxD>1){for(let i=1;i<vals.length;i++)if(Math.random()<.25){const partial=vals.slice(0,i).reduce((a,b)=>a+b,0);if(partial>vals[i])vals[i]*=-1;}}return {mode:cfg.mode,vals,answer:vals.reduce((a,b)=>a+b,0),text:vals.join(' + ').replace(/\+ -/g,'− '),detail:rows+'口'}}
function makeMath(g,m){const t=pick(totals[g]);const aDigits=rand(1,t-1),bDigits=t-aDigits;if(m==='multiply'){const a=digits(aDigits),b=digits(bDigits);return{mode:m,a,b,answer:a*b,text:a+' × '+b,detail:'実法'+t+'桁'}}const divisor=digits(aDigits),quotient=digits(bDigits);return{mode:m,a:divisor*quotient,b:divisor,answer:quotient,text:(divisor*quotient)+' ÷ '+divisor,detail:'法商'+t+'桁'}}
function generate(){let g=$('grade').value;return Array.from({length:Math.min(100,Math.max(1,Number($('count').value)||10))},(_,i)=>{index=i;return ['mitori','flash'].includes(cfg.mode)?makeMitori(g):makeMath(g,cfg.mode)})}
function clearFlash(){flashTimers.forEach(clearTimeout);flashTimers=[]}function tick(){const sec=Math.floor((Date.now()-started)/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if($('limit').checked&&sec>=720)finish(true)}function question(){clearFlash();if(index>=questions.length){finish(false);return}typed='';const q=questions[index];$('answer').textContent='ここに答えを入力';$('answer').classList.add('empty');$('counter').textContent='第'+(index+1)+'問 / '+questions.length+'問';$('bar').style.width=(index/questions.length*100)+'%';$('qmeta').textContent=label($('grade').value)+'・'+q.detail;$('directionNote').textContent=$('direction').value==='high'?'左の桁から入力':'右の桁から入力（数字が左へ追加されます）';$('prompt').textContent='答えを入力してください';$('keypad').classList.remove('hidden');$('question').innerHTML='';if(q.mode==='mitori'){const wrap=document.createElement('div');wrap.className='mitori';q.vals.forEach(v=>{const d=document.createElement('div');d.textContent=v<0?'− '+Math.abs(v):String(v);wrap.appendChild(d)});$('question').appendChild(wrap)}else if(q.mode==='flash'){let at=300;const dur=Number($('speed').value)*1000;$('keypad').classList.add('hidden');$('prompt').textContent='数字を見て暗算してください';q.vals.forEach((v,i)=>{flashTimers.push(setTimeout(()=>{$('question').textContent=v<0?'− '+Math.abs(v):String(v);$('question').classList.add('flashCenter')},at+i*dur))});flashTimers.push(setTimeout(()=>{$('question').textContent='？';$('question').classList.remove('flashCenter');$('keypad').classList.remove('hidden');$('prompt').textContent='合計を入力してください'},at+q.vals.length*dur))}else{$('question').textContent=q.text}}function updateAnswer(){$('answer').classList.toggle('empty',!typed);$('answer').textContent=typed||'ここに答えを入力'}function key(k){if($('game').classList.contains('hidden')||$('keypad').classList.contains('hidden'))return;if(k==='enter'){answers.push({q:questions[index],input:typed,correct:typed!==''&&Number(typed)===questions[index].answer});index++;question();return}if(k==='back'){typed=$('direction').value==='high'?typed.slice(0,-1):typed.slice(1);updateAnswer();return}if(k==='minus'){if(typed.startsWith('-'))typed=typed.slice(1);else typed='-'+typed;updateAnswer();return}if(/^\d$/.test(k)&&typed.replace('-','').length<12){if($('direction').value==='high')typed+=k;else typed=typed.startsWith('-')?'-'+k+typed.slice(1):k+typed;updateAnswer()}}$('keypad').onclick=e=>{const b=e.target.closest('button[data-key]');if(b)key(b.dataset.key)};document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden'))return;if(/^\d$/.test(e.key)){key(e.key);e.preventDefault()}else if(e.key==='Backspace'){key('back');e.preventDefault()}else if(e.key==='Enter'){key('enter');e.preventDefault()}else if(e.key==='-'){key('minus');e.preventDefault()}});
function finish(timeout){clearFlash();clearInterval(ticker);show('results');const good=answers.filter(a=>a.correct).length,sec=Math.floor((Date.now()-started)/1000);$('score').innerHTML='<span class="'+(good===answers.length&&answers.length?'good':'')+'">'+good+' / '+answers.length+' 問正解</span>（'+(answers.length?Math.round(good/answers.length*100):0)+'%）';$('elapsed').textContent='所要時間：'+Math.floor(sec/60)+'分'+sec%60+'秒'+(timeout?'（時間切れ）':'');$('review').innerHTML='';answers.forEach((a,i)=>{const d=document.createElement('div');d.className='review';d.textContent=(a.correct?'✓ ':'✗ ')+(i+1)+'．'+a.q.text+' = '+a.q.answer+' ／ 回答：'+(a.input||'未入力');d.classList.add(a.correct?'good':'bad');$('review').appendChild(d)});if(timeout){let p=document.createElement('p');p.textContent='時間切れにより、未回答の問題は採点対象外です。';$('review').prepend(p)}}function start(){clearInterval(ticker);questions=generate();answers=[];index=0;started=Date.now();show('game');ticker=setInterval(tick,500);tick();question()}$('start').onclick=start;$('retry').onclick=start;$('backSettings').onclick=()=>{clearInterval(ticker);show('settings')};$('quit').onclick=()=>{if(confirm('練習を終了して結果を表示しますか？'))finish(false)};updateSettings();})();
</script></body></html>
