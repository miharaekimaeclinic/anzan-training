<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>暗算</title><style>
/* GitHub Pagesでは、利用許諾を確認したABACUS2.ttfをindex.htmlと同じ場所に置いてください。 */
@font-face{font-family:'AbacusPractice';src:url('./ABACUS2.ttf') format('truetype');font-style:normal;font-weight:400 900;font-display:swap;unicode-range:U+0030-0039}
/* ABACUS2を数字の0〜9だけに使用。× ÷ − や日本語には適用しない。 */
.question,.mitori,.answer,.keypad button[data-key="0"],.keypad button[data-key="1"],.keypad button[data-key="2"],.keypad button[data-key="3"],.keypad button[data-key="4"],.keypad button[data-key="5"],.keypad button[data-key="6"],.keypad button[data-key="7"],.keypad button[data-key="8"],.keypad button[data-key="9"]{font-family:'AbacusPractice',system-ui,-apple-system,sans-serif}

:root{font-family:system-ui,-apple-system,'Yu Gothic',Meiryo,sans-serif;color:#152238;background:#f2f5fa}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:0 auto;padding:16px 14px 65px}h1{font-size:clamp(22px,5vw,30px);margin:8px 0}p{line-height:1.6}small,.muted{color:#65748b}.panel{background:white;padding:18px;border-radius:16px;margin:16px 0;box-shadow:0 4px 20px #182b4710}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{min-width:0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}select,input[type=number]{width:100%;border:1px solid #cad5e3;border-radius:9px;padding:11px;background:white;font-size:16px;color:#152238}button{font:inherit;border:0;border-radius:10px;padding:12px 16px;background:#245dc1;color:white;font-weight:700;cursor:pointer;touch-action:manipulation}button.secondary{background:#e8eef8;color:#254578}button:disabled{opacity:.4;cursor:default}.full{width:100%;margin-top:12px}.hidden{display:none!important}.info{background:#f0f5ff;border-radius:10px;padding:12px;margin-top:12px;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tab{background:#e8eef8;color:#244576}.tab.active{background:#245dc1;color:white}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.question{min-height:155px;display:flex;align-items:center;justify-content:center;font-size:clamp(35px,8vw,65px);font-weight:750;letter-spacing:1px;font-variant-numeric:tabular-nums}.mitori{display:flex;flex-direction:column;align-items:flex-end;width:max-content;margin:auto;font-size:clamp(23px,5.7vw,42px);line-height:1.35;font-variant-numeric:tabular-nums}.mitori div{width:100%;text-align:right}.mitori div:last-child{border-bottom:3px solid #152238}.answer{height:70px;border:2px solid #c5d5ed;background:#f8fbff;border-radius:12px;display:flex;align-items:center;justify-content:flex-end;gap:3px;padding:10px;overflow:hidden;font-size:clamp(27px,7vw,42px);font-variant-numeric:tabular-nums}.answer.empty{color:#9aa9bf}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.keypad button{background:#e9eff9;color:#193457;font-size:24px;padding:15px 6px;min-height:54px}.keypad .action{background:#d5e1f1;font-size:17px}.keypad .confirm{background:#245dc1;color:white;font-size:19px}.result{font-size:23px;font-weight:700;text-align:center}.review{padding:9px 0;border-bottom:1px solid #e1e6ef;font-variant-numeric:tabular-nums}.controls{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.controls button{flex:1}.progress{height:8px;background:#e8eef8;border-radius:8px;overflow:hidden;margin-top:9px}.progress>div{height:100%;width:0;background:#245dc1;transition:width .2s}.mode-note{font-size:12px}.toggleline{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:12px}.toggleline input{height:18px;width:18px}.clock{font-variant-numeric:tabular-nums}.flashCenter{font-size:clamp(55px,13vw,95px)}.good{color:#13734b}.bad{color:#c12d3c}footer{font-size:12px;color:#617088;line-height:1.7;margin-top:25px}@media(max-width:470px){.panel{padding:14px}.grid{gap:10px}.top{font-size:14px}.tabs button{padding:11px 6px}.keypad button{padding:13px 4px}main{padding:10px 10px 50px}}@media(min-width:650px){.tabs{grid-template-columns:repeat(3,1fr)}.keypad{max-width:430px;margin:14px auto}.answer{max-width:430px;margin:auto}}
.directionSwitch{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}.directionSwitch button{padding:10px 12px;background:#e8eef8;color:#254578;font-size:14px}.directionSwitch button.active{background:#245dc1;color:#fff}.historyStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.historyStat{background:#f0f5ff;border-radius:12px;padding:13px 5px;text-align:center}.historyStat strong{font-size:26px;display:block;font-variant-numeric:tabular-nums}.historyStat small{display:block;font-size:12px}.historyRow{border-bottom:1px solid #e1e6ef;padding:10px 0;font-size:14px}.historyRow span{color:#65748b}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionTitle button{padding:8px 10px;font-size:13px} @media(max-width:390px){.historyStat strong{font-size:21px}.directionSwitch button{font-size:13px;padding:10px 8px}}
 .historyMode{border:1px solid #e2eaf5;border-radius:12px;margin:12px 0;padding:10px}.historyMode h3{font-size:16px;margin:4px 0 8px}.historyNote{font-size:13px;color:#64748b}.backupActions{display:flex;gap:8px;flex-wrap:wrap}.backupActions button{flex:1;min-width:150px}.backupStatus{font-size:13px;color:#245478;margin:7px 0}.historyTable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;margin-top:12px}.historyTable th,.historyTable td{border-bottom:1px solid #e4e9f0;padding:10px 5px;text-align:right;white-space:nowrap}.historyTable th:first-child,.historyTable td:first-child{text-align:left}.historyTable th{color:#66758d;font-size:12px}.historyScroll{overflow-x:auto}.badInput{border-color:#c12d3c!important}.statusText{min-height:19px;font-size:12px;color:#a03636;text-align:center;margin:6px 0} main{max-width:690px;padding-top:8px}.panel{margin:10px 0;padding:14px}.historyMode{margin:8px 0}.historyMode h3{font-size:14px;margin:2px 0 6px}.historyTable{margin-top:3px}.historyTable th,.historyTable td{padding:8px 4px}.directionSwitch{margin:8px 0}.question{min-height:132px}.mode-note{margin:0}.field label{font-size:12px}.full{margin-top:10px}#history .sectionTitle h2{font-size:18px;margin:0}#results .result{margin:8px 0}#results #elapsed{margin:8px 0} </style></head><body><main>
<section id="settings" class="panel"><div class="tabs" id="tabs"><button class="tab active" data-mode="mitori">見取暗算</button><button class="tab" data-mode="multiply">かけ暗算</button><button class="tab" data-mode="divide">わり暗算</button></div><div id="variantSettings" class="field" style="margin-top:16px"><label for="variant">問題の種類</label><select id="variant"></select></div><div class="directionSwitch" aria-label="開始時の解答入力方向"><button type="button" data-direction="high" class="active" aria-pressed="true">上の桁から →</button><button type="button" data-direction="low" aria-pressed="false">← 下の桁から</button></div><button id="start" class="full">練習を開始</button><button id="refreshApp" class="full secondary" type="button">↻ 最新版に更新</button></section>
<section id="game" class="panel hidden"><div class="top"><strong id="counter">第1問</strong><span class="clock" id="timer">00:00</span><button id="quit" class="secondary" style="padding:7px 10px">終了</button></div><div id="question" class="question" aria-live="polite"></div><div class="directionSwitch" aria-label="解答入力方向"><button type="button" data-direction="high" class="active" aria-pressed="true">上の桁から →</button><button type="button" data-direction="low" aria-pressed="false">← 下の桁から</button></div><div id="answer" class="answer empty" aria-live="polite">ここに答えを入力</div><div id="statusText" class="statusText" role="status"></div><div class="keypad" id="keypad"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><button class="action" data-key="back">⌫ 消す</button><button data-key="0">0</button><button class="confirm" data-key="enter">決定 ↵</button></div></section>
<section id="results" class="panel hidden"><p id="score" class="result"></p><p id="elapsed" style="text-align:center"></p><div class="controls" style="margin-top:16px"><button id="retry">同じ形式で再開</button><button id="backSettings" class="secondary">設定に戻る</button></div></section>
<section id="history" class="panel"><div class="sectionTitle"><h2>記録</h2><button id="clearHistory" class="secondary" type="button">履歴を削除</button></div><div id="historyList" aria-live="polite"></div></section></main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cfg={mode:'mitori',direction:'high'};
const modeNames={mitori:'見取暗算',multiply:'かけ暗算',divide:'わり暗算'};
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
const digits=d=>rand(10**(d-1),10**d-1);
const variants={
 mitori:[{value:'standard',text:'3桁 × 5行（加減算40%）'}],
 multiply:[{value:'basic',text:'2桁 × 2桁'},{value:'mixed',text:'3桁 × 2桁／2桁 × 3桁（半々）'}],
 divide:[{value:'basic',text:'割る数2桁・商2桁'},{value:'mixed',text:'割る数2桁・商3桁／割る数3桁・商2桁（半々）'}]
};
const historyKey='anzan_training_daily_v3';
const legacyKey='anzan_training_daily_v2';
const directionKey='anzan_training_direction_by_mode_v1';
const modes=['mitori','multiply','divide'];
const variantLabels={multiply:{basic:'種類①：2桁 × 2桁',mixed:'種類②：3桁 × 2桁／2桁 × 3桁'},divide:{basic:'種類①：割る数2桁・商2桁',mixed:'種類②：割る数2桁・商3桁／割る数3桁・商2桁'}};
let active=false,index=0,typed='',q=null,started=0,questionStarted=0,ticker=null,session={count:0,correct:0,elapsedMs:0},currentVariant='standard';
function dateKey(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')}
function shiftedDay(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dateKey(d)}
function readStore(key){try{const o=JSON.parse(localStorage.getItem(key)||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch{return {}}}
function readDaily(){return readStore(historyKey)}
function saveDaily(data){try{localStorage.setItem(historyKey,JSON.stringify(data));return true}catch{alert('履歴を保存できません。SafariのWebサイトデータ設定や空き容量をご確認ください。');return false}}
function fmtTime(ms){return (ms/1000).toFixed(1)+'秒'}
function pct(n,d){return d?(n/d*100).toFixed(1)+'%':'—'}
function validCount(x){return Number.isFinite(x)&&x>=0?x:0}
function summary(v){const r={count:0,correct:0,elapsedMs:0};modes.forEach(m=>{const x=v?.[m];r.count+=validCount(x?.count);r.correct+=validCount(x?.correct);r.elapsedMs+=validCount(x?.elapsedMs)});return r}
function makeTable(host,values){
 const wrap=document.createElement('div');wrap.className='historyScroll';const table=document.createElement('table');table.className='historyTable';
 const head=document.createElement('thead'),tr=document.createElement('tr');['日付','解答数','正答率','平均解答時間'].forEach(t=>{const th=document.createElement('th');th.textContent=t;tr.append(th)});head.append(tr);table.append(head);
 const body=document.createElement('tbody');values.forEach(([d,v])=>{const row=document.createElement('tr');[d,String(v.count)+'問',pct(v.correct,v.count),v.count?fmtTime(v.elapsedMs/v.count):'—'].forEach(t=>{const td=document.createElement('td');td.textContent=t;row.append(td)});body.append(row)});table.append(body);wrap.append(table);host.append(wrap)
}
function renderHistory(){
 const data=readDaily(), host=$('historyList');host.replaceChildren();
 const dates=Object.keys(data).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort().reverse();
 const groups=[
  ['見取暗算',d=>d?.mitori],
  ['かけ暗算 ① 2桁×2桁',d=>d?.multiply?.byVariant?.basic],
  ['かけ暗算 ② 3桁×2桁／2桁×3桁',d=>d?.multiply?.byVariant?.mixed],
  ['わり暗算 ① 割る数2桁・商2桁',d=>d?.divide?.byVariant?.basic],
  ['わり暗算 ② 割る数2桁・商3桁／割る数3桁・商2桁',d=>d?.divide?.byVariant?.mixed]
 ];
 groups.forEach(([label,pick])=>{
  const section=document.createElement('div');section.className='historyMode';
  const title=document.createElement('h3');title.textContent=label;section.append(title);
  const rows=dates.map(d=>[d,pick(data[d])]).filter(([,v])=>v?.count>0);
  if(rows.length)makeTable(section,rows);
  else{const empty=document.createElement('p');empty.className='historyNote';empty.textContent='記録なし';section.append(empty)}
  host.append(section);
 });
 // 旧バージョンの未分類履歴は削除せず、種類別表には表示しない。
}
function logAnswer(correct,elapsedMs){
 const a=readDaily(),d=dateKey(new Date()),m=cfg.mode;
 if(!a[d]||typeof a[d]!=='object')a[d]={};
 if(!a[d][m])a[d][m]={count:0,correct:0,elapsedMs:0};
 const total=a[d][m];
 total.count=validCount(total.count)+1;
 total.correct=validCount(total.correct)+(correct?1:0);
 total.elapsedMs=validCount(total.elapsedMs)+elapsedMs;
 if(m==='multiply'||m==='divide'){
  if(!total.byVariant||typeof total.byVariant!=='object')total.byVariant={};
  const v=currentVariant==='mixed'?'mixed':'basic';
  if(!total.byVariant[v])total.byVariant[v]={count:0,correct:0,elapsedMs:0};
  const item=total.byVariant[v];
  item.count=validCount(item.count)+1;
  item.correct=validCount(item.correct)+(correct?1:0);
  item.elapsedMs=validCount(item.elapsedMs)+elapsedMs;
 }
 saveDaily(a);renderHistory();
}
// 各種目の入力方向を独立に保存する。履歴とは別のキーを使用。
const savedDirections=readStore(directionKey);
const directions=Object.fromEntries(modes.map(mode=>[mode,savedDirections[mode]==='low'?'low':'high']));
function setDirection(v,save=true){
 if(v!=='high'&&v!=='low')return;
 cfg.direction=v;
 directions[cfg.mode]=v;
 document.querySelectorAll('[data-direction]').forEach(b=>{const selected=b.dataset.direction===v;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))});
 if(save){try{localStorage.setItem(directionKey,JSON.stringify(directions))}catch{/* 保存できない場合も現在の操作は継続 */}}
}
function restoreDirectionForMode(){setDirection(directions[cfg.mode]||'high',false)}
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>setDirection(b.dataset.direction));
function updateVariantOptions(){
 const sel=$('variant');sel.replaceChildren();
 variants[cfg.mode].forEach(x=>{const o=document.createElement('option');o.value=x.value;o.textContent=x.text;sel.append(o)});
 $('variantSettings').classList.toggle('hidden',cfg.mode==='mitori');
 if(cfg.mode==='mitori')sel.value='standard';
 updateSettings();
}
function show(view){['settings','game','results'].forEach(x=>$(x).classList.toggle('hidden',x!==view))}
function updateSettings(){}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cfg.mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));updateVariantOptions();restoreDirectionForMode()});
$('variant').onchange=updateSettings;
// 見取暗算：各問題を独立に40%の確率で加減算にする。
// 加減算のときは先頭行を除く4行から、ちょうど2行を負数にする。
// 条件を満たす問題だけを採用し、すべての途中合計を0以上にする。
function makeMitori(){
 const subtract=Math.random()<0.4;
 let vals=[];
 if(!subtract){vals=Array.from({length:5},()=>digits(3));}
 else{
  const positions=[1,2,3,4];
  for(let i=positions.length-1;i>0;i--){const j=rand(0,i);[positions[i],positions[j]]=[positions[j],positions[i]]}
  const minus=new Set(positions.slice(0,2));
  // 負にならない候補が得られるまで生成。正数のみへの置換は行わない。
  for(let attempt=0;attempt<10000;attempt++){
   const candidate=Array.from({length:5},(_,i)=>(minus.has(i)?-1:1)*digits(3));
   let total=0,valid=true;
   for(const value of candidate){total+=value;if(total<0){valid=false;break}}
   if(valid){vals=candidate;break}
  }
  if(!vals.length){ // まれな場合の安全策：正の3行を高め、負の2行を低めに生成
   let sum=0;
   vals=Array.from({length:5},(_,i)=>{const v=minus.has(i)?rand(100,180):rand(850,999);sum+=minus.has(i)?-v:v;return minus.has(i)?-v:v});
  }
 }
 return{mode:'mitori',vals,answer:vals.reduce((a,b)=>a+b,0),detail:'3桁・5行'+(subtract?'・引き算2行':'・足し算のみ')};
}
function makeMath(mode,v){
 if(mode==='multiply'){
  const [ad,bd]=v==='mixed'?(Math.random()<0.5?[3,2]:[2,3]):[2,2];
  const a=digits(ad),b=digits(bd);
  return{mode,a,b,answer:a*b,text:a+' × '+b,detail:ad+'桁 × '+bd+'桁'};
 }
 const [divisorDigits,quotientDigits]=v==='mixed'?(Math.random()<0.5?[2,3]:[3,2]):[2,2];
 const b=digits(divisorDigits),answer=digits(quotientDigits),dividend=b*answer;
 return{mode,a:dividend,b,answer,text:dividend+' ÷ '+b,detail:'割る数'+divisorDigits+'桁・商'+quotientDigits+'桁'};
}
function nextQuestion(){if(!active)return;index++;typed='';$('statusText').textContent='';$('answer').classList.add('empty');$('answer').textContent='ここに答えを入力';$('counter').textContent='第'+index+'問';q=cfg.mode==='mitori'?makeMitori():makeMath(cfg.mode,currentVariant);$('question').replaceChildren();if(q.mode==='mitori'){const w=document.createElement('div');w.className='mitori';q.vals.forEach(v=>{const d=document.createElement('div');d.textContent=v<0?'− '+(-v):String(v);w.append(d)});$('question').append(w)}else{$('question').textContent=q.text}questionStarted=performance.now()}
function updateAnswer(){$('answer').classList.toggle('empty',!typed);$('answer').textContent=typed||'ここに答えを入力';$('statusText').textContent=''}
function submit(){if(!active||!q)return;if(!typed){$('statusText').textContent='数字を入力してから決定してください';return}const elapsedMs=Math.max(0,Math.round(performance.now()-questionStarted)),correct=Number(typed)===q.answer;session.count++;session.correct+=correct?1:0;session.elapsedMs+=elapsedMs;logAnswer(correct,elapsedMs);nextQuestion()}
function key(k){if(!active)return;if(k==='enter'){submit();return}if(k==='back'){typed=cfg.direction==='high'?typed.slice(0,-1):typed.slice(1);updateAnswer();return}if(/^\d$/.test(k)&&typed.length<12){typed=cfg.direction==='high'?typed+k:k+typed;updateAnswer()}}
$('keypad').onclick=e=>{const b=e.target.closest('button[data-key]');if(b)key(b.dataset.key)};
document.addEventListener('keydown',e=>{if(!active)return;let k=null;if(/^\d$/.test(e.key))k=e.key;else if(e.key==='Enter')k='enter';else if(e.key==='Backspace')k='back';if(k){e.preventDefault();key(k)}});
function tick(){const sec=Math.floor((Date.now()-started)/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function finish(){if(!active)return;active=false;clearInterval(ticker);ticker=null;show('results');$('score').textContent=session.count+'問解答・正答率 '+pct(session.correct,session.count);$('elapsed').textContent='平均解答時間：'+(session.count?fmtTime(session.elapsedMs/session.count):'—')+' ／ 解答送信済みの問題だけ集計';renderHistory()}
function start(){clearInterval(ticker);cfg.mode=cfg.mode==='flash'?'mitori':cfg.mode;currentVariant=$('variant').value;active=true;session={count:0,correct:0,elapsedMs:0};index=0;started=Date.now();show('game');nextQuestion();tick();ticker=setInterval(tick,500)}
$('refreshApp').onclick=()=>{const url=new URL(window.location.href);url.searchParams.set('_update',String(Date.now()));window.location.replace(url.toString())};
$('start').onclick=start;$('retry').onclick=start;$('backSettings').onclick=()=>show('settings');$('quit').onclick=finish;
$('clearHistory').onclick=()=>{if(confirm('この端末の履歴をすべて削除しますか？')){try{localStorage.removeItem(historyKey);localStorage.removeItem(legacyKey)}catch{}renderHistory()}};
restoreDirectionForMode();updateVariantOptions();renderHistory();
})();
</script></body></html>
